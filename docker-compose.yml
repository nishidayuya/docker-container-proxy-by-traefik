services:
  traefik:
    image: traefik:v3.6.13
    container_name: traefik-proxy
    ports:
      - "${DOCKER_CONTAINER_PROXY_BY_TRAEFIK_PORT:-127.0.0.1:80}:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config:/config:ro
    restart: always

  generator:
    build: ./generator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    environment:
      - DYNAMIC_CONFIG_PATH=/config/dynamic_conf.yml
      - TRAEFIK_CONTAINER_NAME=traefik-proxy
    restart: unless-stopped
